name: check

# Static checks only, on Node 20 and Node 22, with NO install step: the skin has
# zero runtime dependencies and the whole `check` chain is pure node + git-free
# static analysis. DSH-dependent checks (tools/compat-matrix.mjs,
# tools/upgrade-check.mjs, tools/hook-scan.mjs against a real install, and the
# runtime skinlab matrix) are local-only and documented in docs/COMPATIBILITY.md —
# CI does not have a DSH installation to inspect.
#
# `main` only carries released code: the `main-is-released` job requires its HEAD to
# be exactly the v<version> release commit (tag and manifest agree). Tag pushes are
# handled by release.yml, which runs the same static chain in a clean environment.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No `npm ci` / `npm install` on purpose: node_modules does not exist.
      # Each step is separate so a red run names the failing tool immediately.
      - name: build check (product is current)
        run: node tools/build.mjs --check
      - name: unit tests
        run: node tools/test.mjs
      - name: structure (strict)
        run: node tools/structure.mjs --strict
      - name: audit
        run: node tools/audit.mjs
      - name: check-css
        run: node tools/check-css.mjs
      - name: verify
        run: node tools/verify.mjs
      - name: i18n audit (zh/en completeness)
        run: node tools/i18n-audit.mjs

  # HEAD of `main` must be a released commit. Source installs follow main HEAD, so an
  # unreleased commit on main would ship unreviewed code to every source user.
  main-is-released:
    name: main only carries released code
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: main HEAD must be the v<version> release commit
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          actual="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::main HEAD is not the ${expected} release commit (found: '${actual}'). main only carries released code — cut releases from main through the release flow documented in PUBLISH.md."
            exit 1
          fi
          echo "main HEAD is ${expected}"
