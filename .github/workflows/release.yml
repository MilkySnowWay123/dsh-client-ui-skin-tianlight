name: release

# Builds and publishes ONE release from a pushed `v*` tag in a clean environment:
#   npm run check -> node tools/pack.mjs -> node tools/release-artifacts.mjs
# The four attachments (two identical tarballs, SHA256SUMS.txt, build-manifest.json)
# are attached to a GitHub Release whose body is RELEASE-NOTES-v<version>.md.
#
# Contract enforced here — any violation fails the run before anything is published:
#   - tag === 'v' + package.json version;
#   - stable tags point into `main`; pre-release tags (x.y.z-rc.N) point into `dev`;
#   - RELEASE-NOTES-v<version>.md exists in the tagged tree;
#   - tools/release-artifacts.mjs refuses forbidden paths, machine-specific paths and
#     version mismatches (it exits non-zero, so the job goes red).
#
# `tools/pack.mjs` is the only packing path; CI and a local release run are identical.
#
# WHY `workflow_dispatch` EXISTS (2026-11-16): GitHub creates NO push event when one
# `git push` carries more than three tags. Pushing v2.2.0-v2.2.3 together therefore
# published nothing — the tags landed on the remote and zero `release` runs existed,
# which is indistinguishable from a successful batch until someone looks. The Push
# rules are now: push ONE tag at a time, then run
#   node tools/verify-tag-run.mjs v<version>
# to prove a run was created; if it was not, dispatch this workflow with that tag.
# The dispatch path checks out the tag (never the branch HEAD), runs the same steps,
# and stays idempotent (gh release edit + upload --clobber), so it can also re-publish
# an existing Release without moving the immutable tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish, e.g. v2.3.0 (must already exist)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: build + publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A dispatch has no tag ref, so it must name the immutable tag explicitly;
          # checking out the branch HEAD would publish different code than the tag.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: resolve target tag and commit
        id: target
        shell: bash
        # GITHUB_SHA is the dispatched branch's commit for workflow_dispatch, not the
        # input tag, so the release identity is resolved from the checkout itself.
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "${tag}" ]; then tag="${GITHUB_REF_NAME}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "target: ${tag} @ $(git rev-parse --short HEAD)"
      - name: tag/version + branch contract
        shell: bash
        env:
          TAG: ${{ steps.target.outputs.tag }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          if [ "${TAG}" != "${expected}" ]; then
            echo "::error::tag ${TAG} does not match package.json ${expected}"
            exit 1
          fi
          actual="$(git describe --tags --exact-match "${SHA}" 2>/dev/null || true)"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::the checked-out commit is not ${expected} (found: '${actual}'). For a dispatched run the tag must already exist on the remote; for a tag push the tag must point at the commit that carries package.json ${version}."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/dev:refs/remotes/origin/dev
          case "${version}" in
            *-*)
              echo "pre-release ${version}: must be reachable from dev"
              git merge-base --is-ancestor "${SHA}" origin/dev
              ;;
            *)
              echo "stable ${version}: must be reachable from main (main only carries released code)"
              git merge-base --is-ancestor "${SHA}" origin/main
              ;;
          esac
      - name: static checks (npm run check)
        run: npm run check
      - name: build distributable (the only packing path)
        run: node tools/pack.mjs
      - name: assemble and verify release attachments
        run: node tools/release-artifacts.mjs --commit "${{ steps.target.outputs.sha }}"
      - name: release notes file present
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test -f "RELEASE-NOTES-v${version}.md" || {
            echo "::error::RELEASE-NOTES-v${version}.md is missing from the tagged tree"
            exit 1
          }
      - name: verify SHA256SUMS.txt (GNU coreutils)
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum -c --ignore-missing SHA256SUMS.txt
      - name: publish GitHub Release + attachments (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          notes="RELEASE-NOTES-v${version}.md"
          title="$(head -n 1 "${notes}" | sed -e 's/^# *//' -e 's/\r$//')"
          prerelease_flag=""
          case "${version}" in *-*) prerelease_flag="--prerelease" ;; esac
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "updating release ${TAG}"
            gh release edit "${TAG}" --title "${title}" --notes-file "${notes}" ${prerelease_flag}
          else
            echo "creating release ${TAG}"
            gh release create "${TAG}" --title "${title}" --notes-file "${notes}" ${prerelease_flag}
          fi
          gh release upload "${TAG}" \
            "dist/release/dsh-client-ui-skin-tianlight-${version}.tgz" \
            "dist/release/dsh-client-ui-skin-tianlight.tgz" \
            "dist/release/SHA256SUMS.txt" \
            "dist/release/build-manifest.json" \
            --clobber
          echo ""
          echo "release ${TAG} published from ${GITHUB_SHA}"
          echo "verify locally: node tools/verify-tag-run.mjs ${TAG}"
