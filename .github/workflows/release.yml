name: release

# Builds and publishes ONE release from a pushed `v*` tag in a clean environment:
#   npm run check -> node tools/pack.mjs -> node tools/release-artifacts.mjs
# The four attachments (two identical tarballs, SHA256SUMS.txt, build-manifest.json)
# are attached to a GitHub Release whose body is RELEASE-NOTES-v<version>.md.
#
# Contract enforced here — any violation fails the run before anything is published:
#   - tag === 'v' + package.json version;
#   - stable tags point into `main`; pre-release tags (x.y.z-rc.N) point into `dev`;
#   - RELEASE-NOTES-v<version>.md exists in the tagged tree;
#   - tools/release-artifacts.mjs refuses forbidden paths, machine-specific paths and
#     version mismatches (it exits non-zero, so the job goes red).
#
# `tools/pack.mjs` is the only packing path; CI and a local release run are identical.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build + publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: tag/version + branch contract
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json ${expected}"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/dev:refs/remotes/origin/dev
          case "${version}" in
            *-*)
              echo "pre-release ${version}: must be reachable from dev"
              git merge-base --is-ancestor "${GITHUB_SHA}" origin/dev
              ;;
            *)
              echo "stable ${version}: must be reachable from main (main only carries released code)"
              git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
              ;;
          esac
      - name: static checks (npm run check)
        run: npm run check
      - name: build distributable (the only packing path)
        run: node tools/pack.mjs
      - name: assemble and verify release attachments
        run: node tools/release-artifacts.mjs --commit "${GITHUB_SHA}"
      - name: release notes file present
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test -f "RELEASE-NOTES-v${version}.md" || {
            echo "::error::RELEASE-NOTES-v${version}.md is missing from the tagged tree"
            exit 1
          }
      - name: verify SHA256SUMS.txt (GNU coreutils)
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum -c --ignore-missing SHA256SUMS.txt
      - name: publish GitHub Release + attachments (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          notes="RELEASE-NOTES-v${version}.md"
          title="$(head -n 1 "${notes}" | sed -e 's/^# *//' -e 's/\r$//')"
          prerelease_flag=""
          case "${version}" in *-*) prerelease_flag="--prerelease" ;; esac
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "updating release ${tag}"
            gh release edit "${tag}" --title "${title}" --notes-file "${notes}" ${prerelease_flag}
          else
            echo "creating release ${tag}"
            gh release create "${tag}" --title "${title}" --notes-file "${notes}" ${prerelease_flag}
          fi
          gh release upload "${tag}" \
            "dist/release/dsh-client-ui-skin-tianlight-${version}.tgz" \
            "dist/release/dsh-client-ui-skin-tianlight.tgz" \
            "dist/release/SHA256SUMS.txt" \
            "dist/release/build-manifest.json" \
            --clobber
