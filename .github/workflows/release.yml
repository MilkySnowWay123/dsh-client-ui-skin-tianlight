name: release

# Creates/updates the public GitHub Releases for the pushed tags from the release-note
# files that ship in the repository root (RELEASE-NOTES-v1.0.x.md). Runs on every
# push to main (idempotent: an existing release is edited to match its notes file, a
# missing one is created) and can also be dispatched manually. The workflow uses the
# repository's own GITHUB_TOKEN, so no personal token is needed to publish a release
# after a push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  releases:
    name: publish tag releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: sync releases from RELEASE-NOTES-v*.md (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=0
          for notes in RELEASE-NOTES-v*.md; do
            if [ ! -e "$notes" ]; then
              continue
            fi
            found=1
            tag="${notes#RELEASE-NOTES-}"
            tag="${tag%.md}"
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "skip $tag: tag not present in this checkout"
              continue
            fi
            title="$(head -n 1 "$notes" | sed -e 's/^# *//' -e 's/\r$//')"
            if gh release view "$tag" >/dev/null 2>&1; then
              # The release may already exist (e.g. created from the tag before this
              # workflow ran). The notes file is authoritative, so edit it back into
              # sync instead of leaving the tag-message placeholder as the release.
              echo "updating release $tag: $title"
              gh release edit "$tag" --title "$title" --notes-file "$notes"
              continue
            fi
            echo "creating release $tag: $title"
            gh release create "$tag" --title "$title" --notes-file "$notes" --verify-tag
          done
          if [ "$found" = "0" ]; then
            echo "no RELEASE-NOTES-v*.md files in this checkout"
          fi
